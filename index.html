<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>並び替え最大素数 (Permuted Max Prime) 探索ツール</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS for static Excel export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-calculator text-white text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-sky-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
            並び替え最大素数 探索アナライザー
          </h1>
          <p class="text-xs text-slate-400">Permuted Maximum Prime Explorer (1〜7桁対応)</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="openMathGuideBtn" class="px-3 py-1.5 text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-lightbulb text-amber-400"></i>
          <span>高速化アルゴリズム解説</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Top Grid: Single Tester + Generator Control -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Single Number Tester (Left: 5 Cols) -->
      <section class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-magnifying-glass text-sky-400"></i>
              <span>単一数値テスト (個別に即時検証)</span>
            </h2>
            <span class="text-xs bg-sky-950 text-sky-400 border border-sky-800 px-2 py-0.5 rounded-full">リアルタイム</span>
          </div>
          <p class="text-xs text-slate-400 mb-4">
            入力した数字の桁を並び替えて作れる「最大素数」を判定・出力します。
          </p>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">検証したい数字 (最大7桁)</label>
              <div class="relative">
                <input type="number" id="testNumberInput" value="12345" placeholder="例: 12345 または 99991" 
                  class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-lg font-mono-code text-sky-300 focus:outline-none focus:border-sky-500 transition">
                <button id="runSingleTestBtn" class="absolute right-2 top-2 bottom-2 px-4 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1">
                  <span>検証</span>
                  <i class="fa-solid fa-arrow-right"></i>
                </button>
              </div>
            </div>

            <!-- Result Box -->
            <div id="singleResultBox" class="mt-4 p-4 rounded-xl border bg-slate-950/60 border-slate-800 space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-xs text-slate-400">判定ステータス:</span>
                <span id="singleStatusBadge" class="text-xs font-semibold px-2 py-0.5 rounded border bg-slate-800 text-slate-300">未実行</span>
              </div>
              <div class="flex justify-between items-baseline border-t border-slate-800/80 pt-2">
                <span class="text-xs text-slate-400">並び替え最大素数:</span>
                <span id="singleMaxPrimeVal" class="text-xl font-bold font-mono-code text-amber-400">-</span>
              </div>
              <div id="singleDetails" class="text-xs text-slate-400 space-y-1 pt-1 border-t border-slate-800/50">
                <div class="flex justify-between"><span>各桁の和 (mod 3):</span><span id="singleDigitSum" class="font-mono text-slate-300">-</span></div>
                <div class="flex justify-between"><span>有効な末尾候補:</span><span id="singleValidTails" class="font-mono text-slate-300">-</span></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Batch Digit Generator (Right: 7 Cols) -->
      <section class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-layer-group text-purple-400"></i>
              <span>桁指定・全組み合わせ一括生成 & 探索</span>
            </h2>
            <span class="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded-full">マルチセット処理</span>
          </div>
          <p class="text-xs text-slate-400 mb-4">
            指定した桁数のすべての数字パターン（重複を除く数字組合せ）を高速枝刈りアルゴリズムで一括計算します。
          </p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-end mb-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">対象の桁数を選択 (1〜7桁)</label>
              <select id="digitSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 font-semibold focus:outline-none focus:border-purple-500 transition">
                <option value="1">1桁 (全10パターン)</option>
                <option value="2">2桁 (全55
