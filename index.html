<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素数探索</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel出力用) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen p-4 md:p-8 text-lg">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- ヘッダー -->
        <div class="bg-slate-900 text-white p-6">
            <h1 class="text-3xl font-bold tracking-wide">素数探索</h1>
        </div>

        <!-- タブ切り替え -->
        <div class="flex border-b border-slate-200 bg-slate-50">
            <button id="tab1Btn" onclick="switchMode(1)" class="flex-1 py-4 font-bold text-blue-600 border-b-4 border-blue-600 transition text-xl">
                モード1：指定数字の探索
            </button>
            <button id="tab2Btn" onclick="switchMode(2)" class="flex-1 py-4 font-bold text-slate-500 border-b-4 border-transparent transition text-xl">
                モード2：桁数別一括探索
            </button>
        </div>

        <div class="p-8">
            
            <!-- モード1: 指定数字の探索 -->
            <div id="mode1">
                <div class="mb-6">
                    <label class="block font-bold text-slate-700 mb-2">数字を入力</label>
                    <input type="text" id="numInput" placeholder="" maxlength="20"
                           class="w-full text-2xl font-mono p-4 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                           oninput="saveInput(this.value)">
                </div>

                <div class="mb-6">
                    <label class="block font-bold text-slate-700 mb-2">探索する桁数の上限（最大20）</label>
                    <input type="number" id="maxDigitLimit" value="20" min="1" max="20"
                           class="w-full text-xl p-3 border-2 border-slate-300 rounded-lg">
                </div>

                <button id="m1RunBtn" onclick="runMode1Worker()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg shadow mb-6 transition text-xl">
                    探索を実行
                </button>

                <div id="progressBox1" class="hidden mb-6 p-4 border rounded-lg bg-blue-50 border-blue-200">
                    <div class="flex justify-between font-bold text-blue-800 mb-2">
                        <span id="progressTaskText1">処理中...</span>
                        <span id="progressPercent1">0%</span>
                    </div>
                    <div class="w-full bg-blue-200 rounded-full h-4">
                        <div id="progressBar1" class="bg-blue-600 h-4 rounded-full transition-all duration-150" style="width: 0%"></div>
                    </div>
                </div>

                <div id="m1Result" class="hidden p-6 rounded-lg border border-slate-200 bg-slate-50">
                    <div id="m1Output"></div>
                    <button id="m1DownloadBtn" onclick="downloadMode1File()" class="hidden mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg transition text-xl">
                        Excel出力
                    </button>
                </div>
            </div>

            <!-- モード2: 桁数一括探索 -->
            <div id="mode2" class="hidden">
                <div class="mb-6">
                    <label class="block font-bold text-slate-700 mb-2">桁数を選択</label>
                    <select id="digitSelect" class="w-full text-xl p-4 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 transition">
                        <option value="1">1 桁</option>
                        <option value="2">2 桁</option>
                        <option value="3">3 桁</option>
                        <option value="4">4 桁</option>
                        <option value="5" selected>5 桁</option>
                        <option value="6">6 桁</option>
                        <option value="7">7 桁</option>
                        <option value="8">8 桁</option>
                        <option value="9">9 桁</option>
                        <option value="10">10 桁</option>
                        <option value="11">11 桁</option>
                        <option value="12">12 桁</option>
                        <option value="13">13 桁</option>
                        <option value="14">14 桁</option>
                        <option value="15">15 桁</option>
                        <option value="16">16 桁</option>
                        <option value="17">17 桁</option>
                        <option value="18">18 桁</option>
                        <option value="19">19 桁</option>
                        <option value="20">20 桁</option>
                    </select>
                </div>

                <button id="m2RunBtn" onclick="runMode2MultiWorker()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg shadow mb-6 transition text-xl">
                    探索を実行
                </button>

                <div id="progressBox2" class="hidden mb-6 p-4 border rounded-lg bg-blue-50 border-blue-200">
                    <div class="flex justify-between font-bold text-blue-800 mb-2">
                        <span id="progressTaskText2">処理中...</span>
                        <span id="progressPercent2">0%</span>
                    </div>
                    <div class="w-full bg-blue-200 rounded-full h-4">
                        <div id="progressBar2" class="bg-blue-600 h-4 rounded-full transition-all duration-150" style="width: 0%"></div>
                    </div>
                </div>

                <div id="m2Result" class="hidden">
                    <!-- コントロールバー（総数・検索・並び替え） -->
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4 bg-slate-50 p-4 rounded-lg border">
                        <div>
                            <span id="cacheNotice" class="font-bold text-slate-800">結果一覧</span>
                            <span class="ml-4 text-sm bg-blue-100 text-blue-800 py-1 px-3 rounded-full font-bold">総数: <span id="totalCount">0</span> 件</span>
                        </div>
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            <input type="text" id="searchInput" placeholder="文字列で検索..." oninput="filterTable()"
                                   class="p-2 border rounded-lg text-base w-full md:w-64 font-mono">
                            <select id="sortOrder" onchange="filterTable()" class="p-2 border rounded-lg text-base font-bold bg-white">
                                <option value="desc">降順 (大きい順)</option>
                                <option value="asc">昇順 (小さい順)</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex justify-end mb-4">
                        <button onclick="downloadMode2File()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg transition text-lg">
                            Excel出力
                        </button>
                    </div>

                    <!-- テーブル (高さをコンパクトに詰め、文字拡大) -->
                    <div class="max-h-80 overflow-y-auto border border-slate-200 rounded-lg">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-800 text-white sticky top-0">
                                <tr>
                                    <th class="py-2 px-3 border-b w-16">No.</th>
                                    <th class="py-2 px-3 border-b">数字の組み合わせ</th>
                                    <th class="py-2 px-3 border-b text-right">並び替え最大素数</th>
                                </tr>
                            </thead>
                            <tbody id="m2TableBody" class="divide-y divide-slate-200"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // IndexedDB キャッシュ
        let db = null;
        const request = indexedDB.open("PrimeSearchCacheDB_v2", 1);
        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("mode2Results")) {
                db.createObjectStore("mode2Results", { keyPath: "digitCount" });
            }
        };
        request.onsuccess = function(e) { db = e.target.result; };

        function getCachedMode2(digitCount, callback) {
            if (!db) { callback(null); return; }
            const tx = db.transaction(["mode2Results"], "readonly");
            const store = tx.objectStore("mode2Results");
            const req = store.get(digitCount);
            req.onsuccess = function() { callback(req.result ? req.result.data : null); };
            req.onerror = function() { callback(null); };
        }

        function saveCachedMode2(digitCount, data) {
            if (!db) return;
            const tx = db.transaction(["mode2Results"], "readwrite");
            const store = tx.objectStore("mode2Results");
            store.put({ digitCount: digitCount, data: data });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('prime_search_input');
            if (saved !== null) document.getElementById('numInput').value = saved;
        });

        function saveInput(val) { localStorage.setItem('prime_search_input', val); }

        function switchMode(mode) {
            document.getElementById('mode1').classList.toggle('hidden', mode !== 1);
            document.getElementById('mode2').classList.toggle('hidden', mode !== 2);
            document.getElementById('tab1Btn').className = mode === 1 ? "flex-1 py-4 font-bold text-blue-600 border-b-4 border-blue-600 transition text-xl" : "flex-1 py-4 font-bold text-slate-500 border-b-4 border-transparent transition text-xl";
            document.getElementById('tab2Btn').className = mode === 2 ? "flex-1 py-4 font-bold text-blue-600 border-b-4 border-blue-600 transition text-xl" : "flex-1 py-4 font-bold text-slate-500 border-b-4 border-transparent transition text-xl";
        }

        const sharedScript = `
            function powerMod(base, exp, mod) {
                let res = 1n;
                base = base % mod;
                while (exp > 0n) {
                    if (exp % 2n === 1n) res = (res * base) % mod;
                    base = (base * base) % mod;
                    exp /= 2n;
                }
                return res;
            }

            function isPrime(n) {
                if (n < 2n) return false;
                if (n === 2n || n === 3n || n === 5n || n === 7n || n === 11n || n === 13n) return true;
                if (n % 2n === 0n || n % 3n === 0n || n % 5n === 0n || n % 7n === 0n) return false;
                let d = n - 1n;
                let s = 0n;
                while (d % 2n === 0n) { d /= 2n; s++; }
                const bases = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
                for (let a of bases) {
                    if (a % n === 0n) continue;
                    let x = powerMod(a, d, n);
                    if (x === 1n || x === n - 1n) continue;
                    let composite = true;
                    for (let r = 1n; r < s; r++) {
                        x = (x * x) % n;
                        if (x === n - 1n) { composite = false; break; }
                    }
                    if (composite) return false;
                }
                return true;
            }

            function generatePermutations(arr, current, results) {
                if (arr.length === 0) {
                    if (current.length === 1) results.add(current);
                    else if (current[0] !== '0' && ['1', '3', '7', '9'].includes(current[current.length - 1])) results.add(current);
                    return;
                }
                for (let i = 0; i < arr.length; i++) {
                    const nextArr = arr.slice(0, i).concat(arr.slice(i + 1));
                    generatePermutations(nextArr, current + arr[i], results);
                }
            }

            function getSubsets(arr) {
                const subsets = [];
                const helper = (startIndex, current) => {
                    if (current.length > 0) subsets.push([...current]);
                    for (let i = startIndex; i < arr.length; i++) {
                        current.push(arr[i]);
                        helper(i + 1, current);
                        current.pop();
                    }
                };
                helper(0, []);
                return subsets;
            }
        `;

        // モード1
        let mode1AllFoundPrimes = [];
        let worker1 = null;

        function runMode1Worker() {
            const val = document.getElementById('numInput').value.trim();
            const maxLimit = parseInt(document.getElementById('maxDigitLimit').value) || 20;
            if (!/^\d+$/.test(val)) { alert("半角数字を入力してください。"); return; }

            const progressBox = document.getElementById('progressBox1');
            const progressBar = document.getElementById('progressBar1');
            const progressPercent = document.getElementById('progressPercent1');
            const progressTaskText = document.getElementById('progressTaskText1');
            const m1Result = document.getElementById('m1Result');
            const runBtn = document.getElementById('m1RunBtn');

            progressBox.classList.remove('hidden');
            m1Result.classList.add('hidden');
            runBtn.disabled = true;
            runBtn.classList.add('opacity-50');
            progressTaskText.textContent = "処理中...";

            if (worker1) worker1.terminate();

            const workerCode1 = sharedScript + `
                self.onmessage = function(e) {
                    const { digits, maxLimit } = e.data;
                    const subSets = getSubsets(digits);
                    const total = subSets.length;
                    const primeMap = {};

                    for (let i = 0; i < total; i++) {
                        const sub = subSets[i];
                        if (sub.length > maxLimit) continue;
                        const perms = new Set();
                        generatePermutations(sub, "", perms);

                        for (let pStr of perms) {
                            const num = BigInt(pStr);
                            if (isPrime(num)) {
                                const len = pStr.length;
                                if (!primeMap[len]) primeMap[len] = new Set();
                                primeMap[len].add(num);
                            }
                        }

                        if (i % 5 === 0 || i === total - 1) {
                            const pct = Math.floor(((i + 1) / total) * 100);
                            self.postMessage({ type: 'progress', pct: pct, text: '探索中... (' + (i + 1) + ' / ' + total + ')' });
                        }
                    }
                    self.postMessage({ type: 'complete', primeMap: primeMap });
                };
            `;

            const blob = new Blob([workerCode1], { type: 'application/javascript' });
            worker1 = new Worker(URL.createObjectURL(blob));

            worker1.onmessage = function(e) {
                if (e.data.type === 'progress') {
                    progressBar.style.width = e.data.pct + '%';
                    progressPercent.textContent = e.data.pct + '%';
                    progressTaskText.textContent = e.data.text;
                } else if (e.data.type === 'complete') {
                    finishMode1(e.data.primeMap);
                    runBtn.disabled = false;
                    runBtn.classList.remove('opacity-50');
                }
            };

            worker1.postMessage({ digits: val.split(''), maxLimit: maxLimit });
        }

        function finishMode1(primeMap) {
            document.getElementById('progressBox1').classList.add('hidden');
            const resultBox = document.getElementById('m1Result');
            const output = document.getElementById('m1Output');
            const dlBtn = document.getElementById('m1DownloadBtn');
            resultBox.classList.remove('hidden');

            const lens = Object.keys(primeMap).map(Number).sort((a, b) => b - a);
            mode1AllFoundPrimes = [];

            if (lens.length === 0) {
                output.innerHTML = `<p class="text-rose-600 font-bold">素数なし</p>`;
                dlBtn.classList.add('hidden');
                return;
            }

            let html = `<div class="space-y-4">`;
            let globalMax = null;

            for (let len of lens) {
                // 各桁の上から5つまでを表示
                const sortedPrimes = Array.from(primeMap[len]).map(p => BigInt(p)).sort((a, b) => b > a ? 1 : -1);
                const top5 = sortedPrimes.slice(0, 5);
                const maxP = sortedPrimes[0];
                if (!globalMax || maxP > globalMax) globalMax = maxP;

                for (let p of sortedPrimes) mode1AllFoundPrimes.push(p.toString());

                html += `
                    <div class="border border-slate-300 rounded-lg overflow-hidden bg-white shadow-sm">
                        <button onclick="toggleAccordion(${len})" class="w-full flex justify-between items-center p-4 bg-slate-100 hover:bg-slate-200 font-bold text-slate-800 transition">
                            <span>📌 ${len}桁グループ (全 ${sortedPrimes.length}件のうち上位表示) - 最大: <span class="text-emerald-600">${maxP.toString()}</span></span>
                            <span id="icon_${len}">▼ 開く</span>
                        </button>
                        <div id="acc_${len}" class="hidden p-4 max-h-60 overflow-y-auto font-mono text-base space-y-2 bg-slate-50 border-t">
                            ${top5.map((p, idx) => `<div>${idx + 1}. ${p.toString()}</div>`).join('')}
                            ${sortedPrimes.length > 5 ? `<div class="text-slate-500 text-sm italic">...他 ${sortedPrimes.length - 5} 件省略</div>` : ''}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            output.innerHTML = `<p class="font-bold text-xl mb-4 text-slate-900">全体最大素数: <span class="text-emerald-600 text-2xl">${globalMax.toString()}</span></p>` + html;
            dlBtn.classList.remove('hidden');
        }

        function toggleAccordion(len) {
            const el = document.getElementById(`acc_${len}`);
            const icon = document.getElementById(`icon_${len}`);
            const isHidden = el.classList.contains('hidden');
            el.classList.toggle('hidden', !isHidden);
            icon.textContent = isHidden ? "▲ 閉じる" : "▼ 開く";
        }

        function downloadMode1File() {
            if (mode1AllFoundPrimes.length === 0) return;
            exportExcelNoHeader(mode1AllFoundPrimes, 'max_primes_mode1.xlsx');
        }

        // モード2
        let mode2PrimesOnly = [];
        let activeWorkers = [];

        function runMode2MultiWorker() {
            const digitCount = parseInt(document.getElementById('digitSelect').value);
            getCachedMode2(digitCount, function(cachedData) {
                if (cachedData) {
                    mode2PrimesOnly = cachedData;
                    filterTable();
                    finishMode2(true);
                    return;
                }
                startMode2Calculation(digitCount);
            });
        }

        function startMode2Calculation(digitCount) {
            const progressBox = document.getElementById('progressBox2');
            const progressBar = document.getElementById('progressBar2');
            const progressPercent = document.getElementById('progressPercent2');
            const progressTaskText = document.getElementById('progressTaskText2');
            const m2Result = document.getElementById('m2Result');
            const runBtn = document.getElementById('m2RunBtn');

            progressBox.classList.remove('hidden');
            m2Result.classList.add('hidden');
            runBtn.disabled = true;
            runBtn.classList.add('opacity-50');
            progressTaskText.textContent = "準備中...";

            activeWorkers.forEach(w => w.terminate());
            activeWorkers = [];

            const workerCode2 = sharedScript + `
                function generateMultisets(arr, k, start, current, results) {
                    if (current.length === k) { results.push([...current]); return; }
                    for (let i = start; i < arr.length; i++) {
                        current.push(arr[i]);
                        generateMultisets(arr, k, i, current, results);
                        current.pop();
                    }
                }

                self.onmessage = function(e) {
                    const { tailDigit, digitCount, workerId } = e.data;
                    const results = [];
                    const allDigits = '0123456789'.split('');
                    const subMultisets = [];
                    if (digitCount === 1) subMultisets.push([tailDigit]);
                    else generateMultisets(allDigits, digitCount - 1, 0, [], subMultisets);

                    const total = subMultisets.length;
                    for (let i = 0; i < total; i++) {
                        const rest = subMultisets[i];
                        const combo = [tailDigit, ...rest];
                        if (combo[0] === '0') continue;
                        const sum = combo.reduce((acc, d) => acc + parseInt(d), 0);
                        if (sum % 3 === 0 && combo.length > 1) continue;

                        const perms = new Set();
                        generatePermutations(combo, "", perms);
                        const sortedPerms = Array.from(perms).map(BigInt).sort((a, b) => b > a ? 1 : -1);

                        for (let num of sortedPerms) {
                            if (isPrime(num)) {
                                results.push({ digits: combo.join(''), maxPrime: num.toString() });
                                break;
                            }
                        }
                        if (i % 50 === 0 || i === total - 1) {
                            self.postMessage({ type: 'progress', processed: i + 1, total: total, workerId: workerId });
                        }
                    }
                    self.postMessage({ type: 'complete', results: results, workerId: workerId });
                };
            `;

            const tailDigits = ['1', '3', '7', '9'];
            let completedThreads = 0;
            let allResults = [];
            let progressMap = new Array(tailDigits.length).fill(0);
            let totalsMap = new Array(tailDigits.length).fill(1);

            tailDigits.forEach((tail, idx) => {
                const blob = new Blob([workerCode2], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));
                activeWorkers.push(worker);

                worker.onmessage = function(e) {
                    if (e.data.type === 'progress') {
                        progressMap[e.data.workerId] = e.data.processed;
                        totalsMap[e.data.workerId] = e.data.total;
                        const totalProcessed = progressMap.reduce((a, b) => a + b, 0);
                        const totalCombos = totalsMap.reduce((a, b) => a + b, 0);
                        const pct = Math.floor((totalProcessed / totalCombos) * 100);
                        progressBar.style.width = pct + '%';
                        progressPercent.textContent = pct + '%';
                        progressTaskText.textContent = `探索中... (${totalProcessed} / ${totalCombos})`;
                    } else if (e.data.type === 'complete') {
                        allResults = allResults.concat(e.data.results);
                        completedThreads++;
                        if (completedThreads === tailDigits.length) {
                            mode2PrimesOnly = allResults;
                            saveCachedMode2(digitCount, allResults);
                            filterTable();
                            finishMode2(false);
                            runBtn.disabled = false;
                            runBtn.classList.remove('opacity-50');
                        }
                    }
                };
                worker.postMessage({ tailDigit: tail, digitCount: digitCount, workerId: idx });
            });
        }

        // 検索・昇順降順切り替えフィルタ
        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sortOrder = document.getElementById('sortOrder').value;

            let filtered = mode2PrimesOnly.filter(item => 
                item.digits.toLowerCase().includes(query) || item.maxPrime.toLowerCase().includes(query)
            );

            filtered.sort((a, b) => {
                const valA = BigInt(a.maxPrime);
                const valB = BigInt(b.maxPrime);
                if (sortOrder === 'desc') return valB > valA ? 1 : -1;
                else return valA > valB ? 1 : -1;
            });

            document.getElementById('totalCount').textContent = filtered.length;

            const tableBody = document.getElementById('m2TableBody');
            tableBody.innerHTML = filtered.map((item, idx) => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-2 px-3 border-b text-slate-500">${idx + 1}</td>
                    <td class="py-2 px-3 border-b font-mono">${item.digits}</td>
                    <td class="py-2 px-3 border-b text-right font-mono font-bold text-emerald-600">${item.maxPrime}</td>
                </tr>
            `).join('');
        }

        function finishMode2(isFromCache = false) {
            document.getElementById('progressBox2').classList.add('hidden');
            document.getElementById('m2Result').classList.remove('hidden');
            document.getElementById('cacheNotice').textContent = isFromCache ? "結果一覧 (保存済み)" : "結果一覧";
        }

        function downloadMode2File() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sortOrder = document.getElementById('sortOrder').value;
            let filtered = mode2PrimesOnly.filter(item => 
                item.digits.toLowerCase().includes(query) || item.maxPrime.toLowerCase().includes(query)
            );
            filtered.sort((a, b) => {
                const valA = BigInt(a.maxPrime), valB = BigInt(b.maxPrime);
                return sortOrder === 'desc' ? (valB > valA ? 1 : -1) : (valA > valB ? 1 : -1);
            });

            if (filtered.length === 0) return;
            const primes = filtered.map(item => item.maxPrime);
            exportExcelNoHeader(primes, 'max_primes_only.xlsx');
        }

        function exportExcelNoHeader(dataList, filename) {
            const wsData = dataList.map(val => [isNaN(val) ? val : parseInt(val)]);
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "素数一覧");
            XLSX.writeFile(wb, filename);
        }
    </script>
</body>
</html>
