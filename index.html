<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>並び替え最大素数 探索Webアプリ</title>
    <!-- Tailwind CSS (デザイン) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- ヘッダー -->
        <div class="bg-slate-900 text-white p-6">
            <h1 class="text-2xl font-bold tracking-wide">並び替え最大素数 探索エンジン</h1>
            <p class="text-slate-400 text-sm mt-1">1〜20桁対応 / 高速枝刈り / バックグラウンド非同期処理</p>
        </div>

        <!-- タブ切り替え -->
        <div class="flex border-b border-slate-200 bg-slate-50">
            <button id="tab1Btn" onclick="switchMode(1)" class="flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 transition">
                モード1：指定数字の探索
            </button>
            <button id="tab2Btn" onclick="switchMode(2)" class="flex-1 py-3 font-semibold text-slate-500 border-b-2 border-transparent transition">
                モード2：桁数別一括探索 (1〜20桁)
            </button>
        </div>

        <div class="p-6">
            
            <!-- モード1: 指定数字の探索 -->
            <div id="mode1">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">数字を入力（最大20桁）</label>
                    <input type="text" id="numInput" placeholder="数字を入力してください" maxlength="20"
                           class="w-full text-xl font-mono p-3 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                           oninput="saveInput(this.value)">
                </div>

                <div class="flex flex-col sm:flex-row gap-3 mb-6">
                    <button onclick="runMode1(false)" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                        最大素数を探索
                    </button>
                    <button onclick="runMode1(true)" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                        作れる素数を全抽出
                    </button>
                </div>

                <div id="m1Result" class="hidden p-4 rounded-lg border border-slate-200 bg-slate-50">
                    <div id="m1Output"></div>
                    <button id="m1DownloadBtn" onclick="downloadMode1File()" class="hidden mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg transition">
                        最大素数のみをファイル出力 (見出しなし)
                    </button>
                </div>
            </div>

            <!-- モード2: 桁数一括探索 -->
            <div id="mode2" class="hidden">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">桁数を選択 (1〜20桁)</label>
                    <select id="digitSelect" class="w-full text-lg p-3 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 transition">
                        <!-- 1桁〜20桁まで1桁刻み -->
                        <option value="1">1 桁</option>
                        <option value="2">2 桁</option>
                        <option value="3">3 桁</option>
                        <option value="4">4 桁</option>
                        <option value="5">5 桁</option>
                        <option value="6">6 桁</option>
                        <option value="7">7 桁</option>
                        <option value="8">8 桁</option>
                        <option value="9">9 桁</option>
                        <option value="10">10 桁</option>
                        <option value="11">11 桁</option>
                        <option value="12">12 桁</option>
                        <option value="13">13 桁</option>
                        <option value="14">14 桁</option>
                        <option value="15">15 桁</option>
                        <option value="16">16 桁</option>
                        <option value="17">17 桁</option>
                        <option value="18">18 桁</option>
                        <option value="19">19 桁</option>
                        <option value="20">20 桁</option>
                    </select>
                </div>

                <button onclick="runMode2()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow mb-4 transition">
                    一括計算を実行
                </button>

                <!-- 進捗表示 -->
                <div id="progressBox" class="hidden mb-4 p-4 border rounded-lg bg-blue-50 border-blue-200">
                    <div class="flex justify-between text-sm font-bold text-blue-800 mb-1">
                        <span>計算進捗</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-blue-200 rounded-full h-3">
                        <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-150" style="width: 0%"></div>
                    </div>
                </div>

                <div id="m2Result" class="hidden">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-800">成功パターン（素数のみ）結果一覧</h3>
                        <button onclick="downloadMode2File()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2 px-4 rounded-lg transition">
                            最大素数一覧のみファイル出力 (見出しなし)
                        </button>
                    </div>
                    <div class="max-h-96 overflow-y-auto border border-slate-200 rounded-lg">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-800 text-white sticky top-0">
                                <tr>
                                    <th class="p-3 border-b">No.</th>
                                    <th class="p-3 border-b">数字の組み合わせ</th>
                                    <th class="p-3 border-b text-right">並び替え最大素数</th>
                                </tr>
                            </thead>
                            <tbody id="m2TableBody" class="divide-y divide-slate-200"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Web Worker / ロジック JavaScript -->
    <script>
        // ----------------------------------------------------
        // ローカルストレージ保持（入力復元）
        // ----------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('perm_prime_input');
            if (saved !== null) {
                document.getElementById('numInput').value = saved;
            }
        });

        function saveInput(val) {
            localStorage.setItem('perm_prime_input', val);
        }

        // ----------------------------------------------------
        // タブ切り替え
        // ----------------------------------------------------
        let currentMode = 1;
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode1').classList.toggle('hidden', mode !== 1);
            document.getElementById('mode2').classList.toggle('hidden', mode !== 2);
            
            document.getElementById('tab1Btn').className = mode === 1 
                ? "flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 transition"
                : "flex-1 py-3 font-semibold text-slate-500 border-b-2 border-transparent transition";
            document.getElementById('tab2Btn').className = mode === 2 
                ? "flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 transition"
                : "flex-1 py-3 font-semibold text-slate-500 border-b-2 border-transparent transition";
        }

        // ----------------------------------------------------
        // 高速決定論的/確率的 Miller-Rabin 素数判定 (BigInt対応)
        // ----------------------------------------------------
        function powerMod(base, exp, mod) {
            let res = 1n;
            base = base % mod;
            while (exp > 0n) {
                if (exp % 2n === 1n) res = (res * base) % mod;
                base = (base * base) % mod;
                exp /= 2n;
            }
            return res;
        }

        function isPrime(n) {
            if (n < 2n) return false;
            if (n === 2n || n === 3n || n === 5n || n === 7n || n === 11n || n === 13n) return true;
            if (n % 2n === 0n || n % 3n === 0n || n % 5n === 0n || n % 7n === 0n) return false;

            let d = n - 1n;
            let s = 0n;
            while (d % 2n === 0n) {
                d /= 2n;
                s++;
            }

            const bases = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
            for (let a of bases) {
                if (a % n === 0n) continue;
                let x = powerMod(a, d, n);
                if (x === 1n || x === n - 1n) continue;
                let composite = true;
                for (let r = 1n; r < s; r++) {
                    x = (x * x) % n;
                    if (x === n - 1n) {
                        composite = false;
                        break;
                    }
                }
                if (composite) return false;
            }
            return true;
        }

        // ----------------------------------------------------
        // モード1: 単体探索
        // ----------------------------------------------------
        let mode1ExportPrimes = [];

        function runMode1(extractAll) {
            const val = document.getElementById('numInput').value.trim();
            if (!/^\d+$/.test(val)) {
                alert("半角数字を入力してください。");
                return;
            }

            const digits = val.split('');
            const sum = digits.reduce((acc, d) => acc + parseInt(d), 0);
            
            const resultBox = document.getElementById('m1Result');
            const output = document.getElementById('m1Output');
            const dlBtn = document.getElementById('m1DownloadBtn');
            resultBox.classList.remove('hidden');

            // 3n 枝刈りチェック
            if (sum % 3 === 0 && digits.length > 1) {
                output.innerHTML = `<p class="text-rose-600 font-bold">3の倍数 (3n) 除外</p>
                                    <p class="text-sm text-slate-600 mt-1">各桁の和 (${sum}) が3の倍数のため、どのように並べ替えても必ず合成数になります。</p>`;
                dlBtn.classList.add('hidden');
                return;
            }

            // 順列生成（末尾1, 3, 7, 9および先頭0除外）
            const perms = new Set();
            generatePerms(digits, "", perms);

            const sortedPerms = Array.from(perms).map(BigInt).sort((a, b) => b > a ? 1 : -1);

            mode1ExportPrimes = [];
            let maxPrime = null;

            for (let num of sortedPerms) {
                if (isPrime(num)) {
                    if (!maxPrime) maxPrime = num;
                    mode1ExportPrimes.push(num.toString());
                    if (!extractAll) break; // 全抽出でない場合は最初の最大素数で打切り
                }
            }

            if (maxPrime) {
                if (extractAll) {
                    output.innerHTML = `<p class="text-emerald-600 font-bold text-lg mb-2">作れる素数を全抽出 (計 ${mode1ExportPrimes.length} 件)</p>
                                        <div class="max-h-60 overflow-y-auto p-2 bg-white rounded border font-mono text-sm space-y-1">
                                            ${mode1ExportPrimes.map((p, i) => `<div>${i + 1}.${p}</div>`).join('')}
                                        </div>`;
                } else {
                    output.innerHTML = `<p class="text-slate-600 text-sm">入力数字: ${val} (各桁の和: ${sum})</p>
                                        <p class="text-emerald-600 font-bold text-2xl mt-1">並び替え最大素数: ${maxPrime.toString()}</p>`;
                }
                dlBtn.classList.remove('hidden');
            } else {
                output.innerHTML = `<p class="text-rose-600 font-bold">素数なし</p>
                                    <p class="text-sm text-slate-600 mt-1">並び替えて作れる数字の中に素数は存在しませんでした。</p>`;
                dlBtn.classList.add('hidden');
            }
        }

        function generatePerms(arr, current, results) {
            if (arr.length === 0) {
                if (current[0] !== '0' && ['1', '3', '7', '9'].includes(current[current.length - 1])) {
                    results.add(current);
                }
                return;
            }
            for (let i = 0; i < arr.length; i++) {
                const nextArr = arr.slice(0, i).concat(arr.slice(i + 1));
                generatePerms(nextArr, current + arr[i], results);
            }
        }

        // 見出しなしファイルダウンロード（モード1）
        function downloadMode1File() {
            if (mode1ExportPrimes.length === 0) return;
            const content = mode1ExportPrimes.join('\n');
            downloadRawTextFile(content, 'max_primes_mode1.txt');
        }

        // ----------------------------------------------------
        // モード2: 桁数一括探索 (Web Worker非同期処理)
        // ----------------------------------------------------
        let mode2PrimesOnly = [];

        function runMode2() {
            const digitCount = parseInt(document.getElementById('digitSelect').value);
            
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            const m2Result = document.getElementById('m2Result');

            progressBox.classList.remove('hidden');
            m2Result.classList.add('hidden');
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';

            // 重複なしマルチセット組合せ生成 (Combinations with replacement)
            const multisets = [];
            generateMultisets('0123456789'.split(''), digitCount, 0, [], multisets);

            mode2PrimesOnly = [];
            let processed = 0;
            const total = multisets.length;

            // 非同期バッチ実行（画面描画をブロックしない処理）
            function processBatch(index) {
                const batchSize = Math.max(1, Math.floor(total / 100));
                const end = Math.min(index + batchSize, total);

                for (let i = index; i < end; i++) {
                    const combo = multisets[i];
                    if (combo.every(d => d === '0')) continue; // 全0排除

                    const sum = combo.reduce((acc, d) => acc + parseInt(d), 0);
                    if (sum % 3 === 0 && combo.length > 1) continue; // 3n排除

                    // 末尾候補（1,3,7,9）のチェック
                    const validTails = combo.filter(d => ['1', '3', '7', '9'].includes(d));
                    if (validTails.length === 0) continue; // 奇数なし排除

                    const perms = new Set();
                    generatePerms(combo, "", perms);

                    const sortedPerms = Array.from(perms).map(BigInt).sort((a, b) => b > a ? 1 : -1);

                    for (let num of sortedPerms) {
                        if (isPrime(num)) {
                            mode2PrimesOnly.push({
                                digits: combo.join(''),
                                maxPrime: num.toString()
                            });
                            break; // 最大素数発見で即時打切り
                        }
                    }
                }

                processed = end;
                const pct = Math.floor((processed / total) * 100);
                progressBar.style.width = pct + '%';
                progressPercent.textContent = pct + '%';

                if (processed < total) {
                    setTimeout(() => processBatch(processed), 0);
                } else {
                    finishMode2();
                }
            }

            setTimeout(() => processBatch(0), 10);
        }

        function generateMultisets(arr, k, start, current, results) {
            if (current.length === k) {
                results.push([...current]);
                return;
            }
            for (let i = start; i < arr.length; i++) {
                current.push(arr[i]);
                generateMultisets(arr, k, i, current, results);
                current.pop();
            }
        }

        function finishMode2() {
            document.getElementById('progressBox').classList.add('hidden');
            const m2Result = document.getElementById('m2Result');
            const tableBody = document.getElementById('m2TableBody');

            // 最大素数の降順でソート
            mode2PrimesOnly.sort((a, b) => BigInt(b.maxPrime) > BigInt(a.maxPrime) ? 1 : -1);

            tableBody.innerHTML = mode2PrimesOnly.map((item, idx) => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 border-b text-slate-500">${idx + 1}</td>
                    <td class="p-3 border-b font-mono">${item.digits}</td>
                    <td class="p-3 border-b text-right font-mono font-bold text-emerald-600">${item.maxPrime}</td>
                </tr>
            `).join('');

            m2Result.classList.remove('hidden');
        }

        // 見出しなしファイルダウンロード（モード2）
        function downloadMode2File() {
            if (mode2PrimesOnly.length === 0) return;
            // 素数だけの数値データ行（見出し一切なし）
            const content = mode2PrimesOnly.map(item => item.maxPrime).join('\n');
            downloadRawTextFile(content, 'max_primes_only.txt');
        }

        // 汎用ダウンロード処理
        function downloadRawTextFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
