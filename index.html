<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素数探索</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel出力用) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- ヘッダー -->
        <div class="bg-slate-900 text-white p-6">
            <h1 class="text-2xl font-bold tracking-wide">素数探索</h1>
            <p class="text-slate-400 text-sm mt-1">部分集合順列対応 / 桁別トグル集計 / バックグラウンド非同期処理</p>
        </div>

        <!-- タブ切り替え -->
        <div class="flex border-b border-slate-200 bg-slate-50">
            <button id="tab1Btn" onclick="switchMode(1)" class="flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 transition">
                モード1：指定数字の探索
            </button>
            <button id="tab2Btn" onclick="switchMode(2)" class="flex-1 py-3 font-semibold text-slate-500 border-b-2 border-transparent transition">
                モード2：桁数別一括探索 (1〜20桁)
            </button>
        </div>

        <div class="p-6">
            
            <!-- モード1: 指定数字の探索 -->
            <div id="mode1">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">数字を入力（例: 12345）</label>
                    <input type="text" id="numInput" placeholder="" maxlength="20"
                           class="w-full text-xl font-mono p-3 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                           oninput="saveInput(this.value)">
                </div>

                <div class="flex flex-col sm:flex-row gap-3 mb-6">
                    <button onclick="runMode1(false)" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                        最大素数を探索（桁別最大も表示）
                    </button>
                    <button onclick="runMode1(true)" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                        作れる素数を全抽出（桁別トグルまとめ）
                    </button>
                </div>

                <div id="m1Result" class="hidden p-4 rounded-lg border border-slate-200 bg-slate-50">
                    <div id="m1Output"></div>
                    <button id="m1DownloadBtn" onclick="downloadMode1File()" class="hidden mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg transition">
                        最大素数のみをExcel出力 (見出しなし)
                    </button>
                </div>
            </div>

            <!-- モード2: 桁数一括探索 -->
            <div id="mode2" class="hidden">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">桁数を選択 (1〜20桁)</label>
                    <select id="digitSelect" class="w-full text-lg p-3 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 transition">
                        <option value="1">1 桁</option>
                        <option value="2">2 桁</option>
                        <option value="3">3 桁</option>
                        <option value="4">4 桁</option>
                        <option value="5" selected>5 桁</option>
                        <option value="6">6 桁</option>
                        <option value="7">7 桁</option>
                        <option value="8">8 桁</option>
                        <option value="9">9 桁</option>
                        <option value="10">10 桁</option>
                        <option value="11">11 桁</option>
                        <option value="12">12 桁</option>
                        <option value="13">13 桁</option>
                        <option value="14">14 桁</option>
                        <option value="15">15 桁</option>
                        <option value="16">16 桁</option>
                        <option value="17">17 桁</option>
                        <option value="18">18 桁</option>
                        <option value="19">19 桁</option>
                        <option value="20">20 桁</option>
                    </select>
                </div>

                <button id="m2RunBtn" onclick="runMode2Worker()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow mb-4 transition">
                    一括計算を実行
                </button>

                <!-- 進捗表示（詳細タスクメッセージ付き） -->
                <div id="progressBox" class="hidden mb-4 p-4 border rounded-lg bg-blue-50 border-blue-200">
                    <div class="flex justify-between text-sm font-bold text-blue-800 mb-1">
                        <span id="progressTaskText">待機中...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-blue-200 rounded-full h-3">
                        <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-150" style="width: 0%"></div>
                    </div>
                </div>

                <div id="m2Result" class="hidden">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-800">成功パターン（素数のみ）結果一覧</h3>
                        <button onclick="downloadMode2File()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2 px-4 rounded-lg transition">
                            最大素数一覧のみExcel出力 (見出しなし)
                        </button>
                    </div>
                    <div class="max-h-96 overflow-y-auto border border-slate-200 rounded-lg">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-800 text-white sticky top-0">
                                <tr>
                                    <th class="p-3 border-b">No.</th>
                                    <th class="p-3 border-b">数字の組み合わせ</th>
                                    <th class="p-3 border-b text-right">並び替え最大素数</th>
                                </tr>
                            </thead>
                            <tbody id="m2TableBody" class="divide-y divide-slate-200"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // 初期状態・ローカルストレージ保持
        // ----------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('prime_search_input');
            if (saved !== null) {
                document.getElementById('numInput').value = saved;
            }
        });

        function saveInput(val) {
            localStorage.setItem('prime_search_input', val);
        }

        function switchMode(mode) {
            document.getElementById('mode1').classList.toggle('hidden', mode !== 1);
            document.getElementById('mode2').classList.toggle('hidden', mode !== 2);
            
            document.getElementById('tab1Btn').className = mode === 1 
                ? "flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 transition"
                : "flex-1 py-3 font-semibold text-slate-500 border-b-2 border-transparent transition";
            document.getElementById('tab2Btn').className = mode === 2 
                ? "flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 transition"
                : "flex-1 py-3 font-semibold text-slate-500 border-b-2 border-transparent transition";
        }

        // ----------------------------------------------------
        // Miller-Rabin 素数判定 (BigInt対応)
        // ----------------------------------------------------
        function powerMod(base, exp, mod) {
            let res = 1n;
            base = base % mod;
            while (exp > 0n) {
                if (exp % 2n === 1n) res = (res * base) % mod;
                base = (base * base) % mod;
                exp /= 2n;
            }
            return res;
        }

        function isPrime(n) {
            if (n < 2n) return false;
            if (n === 2n || n === 3n || n === 5n || n === 7n || n === 11n || n === 13n) return true;
            if (n % 2n === 0n || n % 3n === 0n || n % 5n === 0n || n % 7n === 0n) return false;

            let d = n - 1n;
            let s = 0n;
            while (d % 2n === 0n) {
                d /= 2n;
                s++;
            }

            const bases = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
            for (let a of bases) {
                if (a % n === 0n) continue;
                let x = powerMod(a, d, n);
                if (x === 1n || x === n - 1n) continue;
                let composite = true;
                for (let r = 1n; r < s; r++) {
                    x = (x * x) % n;
                    if (x === n - 1n) {
                        composite = false;
                        break;
                    }
                }
                if (composite) return false;
            }
            return true;
        }

        // ----------------------------------------------------
        // モード1: 指定数字のサブセット順列探索 ＆ 桁別トグルまとめ
        // ----------------------------------------------------
        let mode1AllFoundPrimes = [];

        function runMode1(extractAll) {
            const val = document.getElementById('numInput').value.trim();
            if (!/^\d+$/.test(val)) {
                alert("半角数字を入力してください。");
                return;
            }

            const digits = val.split('');
            const resultBox = document.getElementById('m1Result');
            const output = document.getElementById('m1Output');
            const dlBtn = document.getElementById('m1DownloadBtn');
            resultBox.classList.remove('hidden');

            // 入力数字のすべての部分集合（1個〜全桁）を生成し、それぞれの順列から素数を探す
            const allSubsets = getSubsets(digits);
            const primeMap = {}; // 桁数ごとの素数リスト

            for (let sub of allSubsets) {
                const perms = new Set();
                generatePermutationsFromSubset(sub, "", perms);

                for (let pStr of perms) {
                    const num = BigInt(pStr);
                    if (isPrime(num)) {
                        const len = pStr.length;
                        if (!primeMap[len]) primeMap[len] = new Set();
                        primeMap[len].add(num);
                    }
                }
            }

            // 桁数ごとに整理して降順ソート
            const lens = Object.keys(primeMap).map(Number).sort((a, b) => b - a);
            mode1AllFoundPrimes = [];

            if (lens.length === 0) {
                output.innerHTML = `<p class="text-rose-600 font-bold">素数なし</p><p class="text-sm text-slate-600 mt-1">この数字から作れる素数は存在しませんでした。</p>`;
                dlBtn.classList.add('hidden');
                return;
            }

            let html = `<div class="space-y-4">`;
            let globalMax = null;

            for (let len of lens) {
                const sortedPrimes = Array.from(primeMap[len]).sort((a, b) => b > a ? 1 : -1);
                const maxP = sortedPrimes[0];
                if (!globalMax || maxP > globalMax) globalMax = maxP;

                for (let p of sortedPrimes) {
                    mode1AllFoundPrimes.push(p.toString());
                }

                html += `
                    <div class="border border-slate-300 rounded-lg overflow-hidden bg-white shadow-sm">
                        <button onclick="toggleAccordion(${len})" class="w-full flex justify-between items-center p-3 bg-slate-100 hover:bg-slate-200 font-bold text-slate-800 transition">
                            <span>📌 ${len}桁の素数グループ (計 ${sortedPrimes.length}件) - 最大: <span class="text-emerald-600">${maxP.toString()}</span></span>
                            <span id="icon_${len}">▼ 開く</span>
                        </button>
                        <div id="acc_${len}" class="hidden p-3 max-h-48 overflow-y-auto font-mono text-sm space-y-1 bg-slate-50 border-t">
                            ${sortedPrimes.map((p, idx) => `<div>${idx + 1}. ${p.toString()}</div>`).join('')}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            output.innerHTML = `<p class="font-bold text-lg mb-3 text-slate-800">全体最大素数: <span class="text-emerald-600 text-xl">${globalMax.toString()}</span></p>` + html;
            dlBtn.classList.remove('hidden');
        }

        function getSubsets(arr) {
            const subsets = [];
            const helper = (startIndex, current) => {
                if (current.length > 0) {
                    subsets.push([...current]);
                }
                for (let i = startIndex; i < arr.length; i++) {
                    current.push(arr[i]);
                    helper(i + 1, current);
                    current.pop();
                }
            };
            helper(0, []);
            return subsets;
        }

        function generatePermutationsFromSubset(arr, current, results) {
            if (arr.length === 0) {
                if (current.length === 1) {
                    results.add(current);
                } else if (current[0] !== '0' && ['1', '3', '7', '9'].includes(current[current.length - 1])) {
                    results.add(current);
                }
                return;
            }
            for (let i = 0; i < arr.length; i++) {
                const nextArr = arr.slice(0, i).concat(arr.slice(i + 1));
                generatePermutationsFromSubset(nextArr, current + arr[i], results);
            }
        }

        function toggleAccordion(len) {
            const el = document.getElementById(`acc_${len}`);
            const icon = document.getElementById(`icon_${len}`);
            const isHidden = el.classList.contains('hidden');
            el.classList.toggle('hidden', !isHidden);
            icon.textContent = isHidden ? "▲ 閉じる" : "▼ 開く";
        }

        function downloadMode1File() {
            if (mode1AllFoundPrimes.length === 0) return;
            exportExcelNoHeader(mode1AllFoundPrimes, 'max_primes_mode1.xlsx');
        }

        // ----------------------------------------------------
        // モード2: 桁数一括探索 (Web Worker + 詳細タスク表示)
        // ----------------------------------------------------
        let mode2PrimesOnly = [];
        let worker = null;

        function runMode2Worker() {
            const digitCount = parseInt(document.getElementById('digitSelect').value);
            
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            const progressTaskText = document.getElementById('progressTaskText');
            const m2Result = document.getElementById('m2Result');
            const runBtn = document.getElementById('m2RunBtn');

            progressBox.classList.remove('hidden');
            m2Result.classList.add('hidden');
            runBtn.disabled = true;
            runBtn.classList.add('opacity-50');
            progressTaskText.textContent = "数字の組み合わせ（マルチセット）を生成中...";

            if (worker) worker.terminate();

            const workerCode = `
                function powerMod(base, exp, mod) {
                    let res = 1n;
                    base = base % mod;
                    while (exp > 0n) {
                        if (exp % 2n === 1n) res = (res * base) % mod;
                        base = (base * base) % mod;
                        exp /= 2n;
                    }
                    return res;
                }

                function isPrime(n) {
                    if (n < 2n) return false;
                    if (n === 2n || n === 3n || n === 5n || n === 7n || n === 11n || n === 13n) return true;
                    if (n % 2n === 0n || n % 3n === 0n || n % 5n === 0n || n % 7n === 0n) return false;

                    let d = n - 1n;
                    let s = 0n;
                    while (d % 2n === 0n) {
                        d /= 2n;
                        s++;
                    }

                    const bases = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
                    for (let a of bases) {
                        if (a % n === 0n) continue;
                        let x = powerMod(a, d, n);
                        if (x === 1n || x === n - 1n) continue;
                        let composite = true;
                        for (let r = 1n; r < s; r++) {
                            x = (x * x) % n;
                            if (x === n - 1n) {
                                composite = false;
                                break;
                            }
                        }
                        if (composite) return false;
                    }
                    return true;
                }

                function generateMultisets(arr, k, start, current, results) {
                    if (current.length === k) {
                        results.push([...current]);
                        return;
                    }
                    for (let i = start; i < arr.length; i++) {
                        current.push(arr[i]);
                        generateMultisets(arr, k, i, current, results);
                        current.pop();
                    }
                }

                function generatePermutations(arr, current, results) {
                    if (arr.length === 0) {
                        if (current.length === 1) {
                            results.add(current);
                        } else if (current[0] !== '0' && ['1', '3', '7', '9'].includes(current[current.length - 1])) {
                            results.add(current);
                        }
                        return;
                    }
                    for (let i = 0; i < arr.length; i++) {
                        const nextArr = arr.slice(0, i).concat(arr.slice(i + 1));
                        generatePermutations(nextArr, current + arr[i], results);
                    }
                }

                self.onmessage = function(e) {
                    const digitCount = e.data.digitCount;
                    self.postMessage({ type: 'status', text: '組合せ（マルチセット）を生成中...' });

                    const multisets = [];
                    generateMultisets('0123456789'.split(''), digitCount, 0, [], multisets);

                    const total = multisets.length;
                    const results = [];

                    for (let i = 0; i < total; i++) {
                        const combo = multisets[i];
                        if (combo.every(d => d === '0')) continue;

                        const sum = combo.reduce((acc, d) => acc + parseInt(d), 0);
                        if (sum % 3 === 0 && combo.length > 1) continue; // 3n枝刈り

                        const validTails = combo.filter(d => ['1', '3', '7', '9'].includes(d));
                        if (digitCount > 1 && validTails.length === 0) continue; // 奇数なし枝刈り

                        const perms = new Set();
                        generatePermutations(combo, "", perms);

                        const sortedPerms = Array.from(perms).map(BigInt).sort((a, b) => b > a ? 1 : -1);

                        for (let num of sortedPerms) {
                            if (isPrime(num)) {
                                results.push({
                                    digits: combo.join(''),
                                    maxPrime: num.toString()
                                });
                                break;
                            }
                        }

                        if (i % 20 === 0 || i === total - 1) {
                            const pct = Math.floor(((i + 1) / total) * 100);
                            self.postMessage({ 
                                type: 'progress', 
                                pct: pct, 
                                text: \`並び替え・素数探索中... (\${i + 1} / \text{total} 組)\`.replace('text', total) 
                            });
                        }
                    }

                    self.postMessage({ type: 'complete', results: results });
                };
            `;

            const blob = new Blob([workerCode], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                if (e.data.type === 'status') {
                    progressTaskText.textContent = e.data.text;
                } else if (e.data.type === 'progress') {
                    progressBar.style.width = e.data.pct + '%';
                    progressPercent.textContent = e.data.pct + '%';
                    progressTaskText.textContent = e.data.text;
                } else if (e.data.type === 'complete') {
                    mode2PrimesOnly = e.data.results;
                    finishMode2();
                    runBtn.disabled = false;
                    runBtn.classList.remove('opacity-50');
                }
            };

            worker.postMessage({ digitCount: digitCount });
        }

        function finishMode2() {
            document.getElementById('progressBox').classList.add('hidden');
            const m2Result = document.getElementById('m2Result');
            const tableBody = document.getElementById('m2TableBody');

            mode2PrimesOnly.sort((a, b) => BigInt(b.maxPrime) > BigInt(a.maxPrime) ? 1 : -1);

            tableBody.innerHTML = mode2PrimesOnly.map((item, idx) => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 border-b text-slate-500">${idx + 1}</td>
                    <td class="p-3 border-b font-mono">${item.digits}</td>
                    <td class="p-3 border-b text-right font-mono font-bold text-emerald-600">${item.maxPrime}</td>
                </tr>
            `).join('');

            m2Result.classList.remove('hidden');
        }

        function downloadMode2File() {
            if (mode2PrimesOnly.length === 0) return;
            const primes = mode2PrimesOnly.map(item => item.maxPrime);
            exportExcelNoHeader(primes, 'max_primes_only.xlsx');
        }

        // ----------------------------------------------------
        // 見出しなし・静的固定のExcel出力機能 (SheetJS)
        // ----------------------------------------------------
        function exportExcelNoHeader(dataList, filename) {
            // A列に値のみを上から順に出力（見出し行なし）
            const wsData = dataList.map(val => [isNaN(val) ? val : parseInt(val)]);
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "素数一覧");
            XLSX.writeFile(wb, filename);
        }
    </script>
</body>
</html>
